<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080809"><title>UILIST — Good tools. Great interfaces.</title><link rel="stylesheet" href="assets/lucide.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="sidebar-backdrop" hidden></div><aside id="sidebar" aria-label="UILIST navigation"><div class="sidebar-header"><a class="brand" href="./" aria-label="UILIST home"><span class="brand-full">UILIST</span><span class="brand-short" aria-hidden="true">U</span></a><button class="sidebar-close utility" aria-label="Close navigation"><i class="icon-x" aria-hidden="true"></i></button></div><nav aria-label="Your library" class="library"><button data-page="all" class="nav-item active"><i class="icon-grid-2x2" aria-hidden="true"></i><span>All websites</span><small id="all-count"></small></button><button data-page="saved" class="nav-item"><i class="icon-heart" aria-hidden="true"></i><span>Favourites</span><small id="saved-count">0</small></button></nav><nav id="categories" aria-label="Categories"></nav><div class="sidebar-bottom"><button class="submit nav-item" id="submit"><i class="icon-circle-plus" aria-hidden="true"></i><span>Submit a website</span></button><p>Curated for the curious.<br>A little corner of the internet.</p></div><button class="sidebar-rail" aria-label="Collapse sidebar" title="Collapse sidebar (⌘B)"></button></aside>
<main><header class="topbar"><button class="utility mobile-menu" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true"><i class="icon-panel-left" aria-hidden="true"></i></button><div class="search-wrap"><i class="icon-search" aria-hidden="true"></i><input id="search" type="search" aria-label="Search websites" placeholder="Search websites…"><kbd>/</kbd></div><div class="segments" id="price" role="group" aria-label="Pricing"><button data-price="All" class="selected" aria-pressed="true">All</button><button data-price="Free" aria-pressed="false">Free</button><button data-price="Paid" aria-pressed="false">Paid</button></div><nav class="top-nav segments" aria-label="Main navigation"><button id="explore" class="selected">Explore</button><button id="collections">Collections</button><button id="about">About</button></nav><button class="utility" id="theme" aria-label="Switch to light theme"><i class="icon-sun" aria-hidden="true"></i></button></header>
<section class="heading"><div><h1 id="title">All websites</h1><p id="subtitle">Good tools. Great interfaces.</p></div><button id="clear" hidden>Clear filters <i class="icon-x" aria-hidden="true"></i></button></section><section id="grid" class="grid" aria-label="Websites"></section><section id="empty" hidden><i class="icon-search" aria-hidden="true"></i><h2>Nothing here just yet.</h2><p id="empty-description"></p><button id="empty-reset">Show all websites</button></section><footer><span id="result-count"></span><span>Handpicked, not scraped.</span></footer></main>
<dialog id="dialog"><button class="close utility" aria-label="Close dialog"><i class="icon-x" aria-hidden="true"></i></button><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
