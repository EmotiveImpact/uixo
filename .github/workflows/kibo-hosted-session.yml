name: Authenticated Kibo preview acceptance

on:
  push:
    branches: ['astra/provider-ingestion-2026-09-20']
    paths: ['.github/workflows/kibo-hosted-session.yml']

permissions:
  contents: read
  issues: read

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create an ephemeral encrypted session handoff
        run: |
          mkdir -p public-handoff
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/uixo-preview-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/uixo-preview-private.pem" -pubout -out public-handoff/public.pem
          printf '%s\n' "$GITHUB_SHA" > public-handoff/commit.txt
          printf '%s\n' "$GITHUB_RUN_ID" > public-handoff/run.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kibo-qa-public-key-${{ github.run_id }}
          path: public-handoff
          retention-days: 1
      - name: Install isolated browser tools
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Receive only the encrypted maintainer-issued session
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/browser/preview_session.py
      - name: Verify this exact deployment without catalogue mutations
        env:
          UIXO_EXPECTED_BUILD: ${{ github.sha }}
        run: |
          export UIXO_PREVIEW_SHARE_FILE="$RUNNER_TEMP/uixo-preview-session.txt"
          python tests/browser/kibo_hosted.py
      - name: Destroy the ephemeral session and private key
        if: always()
        run: rm -f "$RUNNER_TEMP/uixo-preview-private.pem" "$RUNNER_TEMP/uixo-preview-session.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kibo-hosted-acceptance-${{ github.run_id }}
          path: test-results/intelligence/kibo-hosted
          retention-days: 7
