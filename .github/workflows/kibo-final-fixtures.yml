name: Apply reviewed Kibo coverage and search fixtures

on:
  push:
    branches: ['astra/provider-ingestion-2026-09-20']
    paths: ['.github/workflows/kibo-final-fixtures.yml']

permissions:
  contents: write

jobs:
  fixtures:
    if: github.repository == 'EmotiveImpact/uixo' && github.ref == 'refs/heads/astra/provider-ingestion-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply the exact locally tested coverage change and finite fixture corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('registry/intelligence.ts')
          text = path.read_text()
          old = """  const pinnedLive = Boolean(
              live &&
              /^[a-f0-9]{40}$/i.test(live.ref) &&
              asset.variants.some((v) => v.sourceRef === live.ref),
            );"""
          old = old.replace('              ', '    ').replace('            );', '  );')
          new = """  const pinnedLive = Boolean(
              (live &&
                /^[a-f0-9]{40}$/i.test(live.ref) &&
                asset.variants.some((v) => v.sourceRef === live.ref)) ||
                (reviewedPreviewPath(asset) && asset.variants.some((v) => v.sourceRef === KIBO_REF)),
            );"""
          assert text.count(old) == 1, 'Coverage implementation changed'
          text = "import { reviewedPreviewPath } from '../shared/reviewed-previews.ts';\nimport { KIBO_REF } from './kibo.ts';\n" + text.replace(old, new)
          path.write_text(text)
          path = Path('tests/browser/intelligence.py')
          text = path.read_text()
          old = "expect(page.locator('.dv2-source-card')).to_have_count(1)"
          assert text.count(old) == 1
          new = """expect(page.locator('.dv2-source-card')).to_have_count(2)
                  expect(page.locator('.dv2-source-card').filter(has=page.get_by_role('heading', name='shadcn/ui', exact=True))).to_have_count(1)
                  expect(page.locator('.dv2-source-card').filter(has=page.get_by_role('heading', name='Kibo UI', exact=True))).to_have_count(1)"""
          path.write_text(text.replace(old, new.replace('                  expect', '        expect')))
          path = Path('package.json')
          data = json.loads(path.read_text())
          assert 'kibo-safety.node.ts' not in data['scripts']['registry:test']
          data['scripts']['registry:test'] += ' tests/registry/kibo-safety.node.ts'
          path.write_text(json.dumps(data, indent=2) + '\n')
          path = Path('tools/verify-registry.mjs')
          text = path.read_text()
          old = "'tests/registry/kibo.node.ts',"
          assert text.count(old) == 1
          path.write_text(text.replace(old, old + "\n    'tests/registry/kibo-safety.node.ts',"))
          path = Path('docs/PROVIDER-INGESTION-QUEUE.md')
          path.write_text(path.read_text().replace('UIXO_EDITORIAL_REASON', 'UIXO_REVIEW_REASON'))
          PY
          npm ci --ignore-scripts
          git diff --name-only -z | xargs -0 npx prettier --write --ignore-unknown
          python -m py_compile tests/browser/intelligence.py
          node --experimental-strip-types --test tests/registry/core.node.ts tests/registry/kibo.node.ts tests/registry/kibo-safety.node.ts tests/registry/dependency-notices.node.ts
      - name: Commit ordinary source and fixture files only to this PR branch
        run: |
          git fetch origin astra/provider-ingestion-2026-09-20
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add registry/intelligence.ts tests/browser/intelligence.py package.json tools/verify-registry.mjs docs/PROVIDER-INGESTION-QUEUE.md
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recognise reviewed live previews and preserve precise source-search checks'
          git push origin HEAD:refs/heads/astra/provider-ingestion-2026-09-20
