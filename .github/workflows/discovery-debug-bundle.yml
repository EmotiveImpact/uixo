name: Isolated Discovery diagnostic bundle
on:
  push:
    branches: [build/discovery-v2-phase1]
    paths: [.github/workflows/discovery-debug-bundle.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix registry --ignore-scripts
      - name: Package public source and locked dependencies, never environment secrets
        run: |
          git archive --format=tar HEAD > /tmp/uixo-source.tar
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf /tmp/uixo-dependencies.tar.gz node_modules registry/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-diagnostic-source
          path: |
            /tmp/uixo-source.tar
            /tmp/uixo-dependencies.tar.gz
          retention-days: 1
