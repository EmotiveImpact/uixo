name: Redesign review inputs

on:
  push:
    branches: ['astra/visual-redesign-ui8-2026-09-20']
    paths: ['.github/workflows/redesign-review-inputs.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build exact locked previews without application credentials
        run: |
          mkdir -p "$RUNNER_TEMP/redesign-inputs"
          export npm_config_cache="$RUNNER_TEMP/redesign-npm"
          npm ci --ignore-scripts
          npm run build
          tar -czf "$RUNNER_TEMP/redesign-inputs/dist.tar.gz" dist
          tar -C "$npm_config_cache" -czf "$RUNNER_TEMP/redesign-inputs/npm-cache.tar.gz" _cacache
          git rev-parse HEAD > "$RUNNER_TEMP/redesign-inputs/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-preview-inputs
          path: ${{ runner.temp }}/redesign-inputs
          retention-days: 3
