name: Redesign source capture
on:
  push:
    branches: ['astra/visual-redesign-ui8-2026-09-20']
    paths: ['.github/workflows/redesign-source-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir handoff
          git rev-parse HEAD > handoff/commit.txt
          git archive --format=tar.gz --output=handoff/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: redesign-source
          path: handoff
          retention-days: 3
