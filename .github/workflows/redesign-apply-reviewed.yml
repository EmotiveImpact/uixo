name: Apply reviewed UIXO finishing patch

on:
  push:
    branches: ['astra/visual-redesign-ui8-2026-09-20']
    paths: ['.github/workflows/redesign-apply-reviewed.yml', 'ops/redesign-final.patch.b64', 'ops/redesign-repairs.json']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'EmotiveImpact/uixo' && github.ref == 'refs/heads/astra/visual-redesign-ui8-2026-09-20'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: exact-review-transfer
          path: ops/redesign-final.patch.b64
          retention-days: 1
      - name: Apply only the checksum-verified local source patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          payload = Path('ops/redesign-final.patch.b64').read_text().strip()
          repairs = Path('ops/redesign-repairs.json')
          if repairs.exists():
              for item in json.loads(repairs.read_text()):
                  assert payload.count(item['old']) == 1
                  payload = payload.replace(item['old'], item['new'])
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert len(patch) == 34378
          assert hashlib.sha256(patch).hexdigest() == '5d8ba43c8d7b9cd92f09d091a14f36bbaf2aebdf5926854a4cc684419c9d8e68'
          Path('/tmp/redesign.patch').write_bytes(patch)
          PY
          git apply --check /tmp/redesign.patch
          git apply --index /tmp/redesign.patch
          git rm ops/redesign-final.patch.b64
          if test -f ops/redesign-repairs.json; then git rm ops/redesign-repairs.json; fi
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Commit to this review branch only
        run: |
          git fetch origin astra/visual-redesign-ui8-2026-09-20
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): finish prototype interactions, navigation and visual acceptance'
          git push origin HEAD:refs/heads/astra/visual-redesign-ui8-2026-09-20
