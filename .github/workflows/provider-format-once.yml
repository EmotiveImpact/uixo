name: Format provider runtime once

on:
  push:
    branches:
      - feat/provider-ingestion-approved-wave
    paths:
      - '.github/workflows/provider-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'EmotiveImpact/uixo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write registry/providers.ts tests/registry/core.node.ts
      - name: Commit only formatting changes
        run: |
          git add -- registry/providers.ts tests/registry/core.node.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format reviewed provider runtime'
          git push origin 'HEAD:refs/heads/feat/provider-ingestion-approved-wave'
