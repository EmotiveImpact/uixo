name: Temporary Phase 1 verification workspace
on:
  push:
    branches: [build/phase1-release-hardening]
    paths: [.github/workflows/phase1-workspace.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix registry --ignore-scripts
      - name: Package source and locked test dependencies without credentials
        run: |
          tar --exclude='./.git' --exclude='.env*' --exclude='./test-results' --exclude='./dist' --exclude='./public/live-demos' -czf /tmp/uixo-verification-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-verification-workspace
          path: /tmp/uixo-verification-workspace.tgz
          retention-days: 1
