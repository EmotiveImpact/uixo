name: Temporary public Phase 1 release audit
on:
  push:
    branches: [build/phase1-release-hardening]
    paths: [.github/workflows/phase1-public-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public release endpoints only
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          origin = 'https://uixo-brown.vercel.app'
          for action in ['status', 'source-directory', 'collections']:
              try:
                  request = urllib.request.Request(origin + '/api/registry?action=' + action, headers={'User-Agent': 'UIXO-release-readiness/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.loads(response.read(1000000))
                      fields = ['release', 'build', 'storage', 'readOnly', 'intelligence', 'stats', 'role'] if action == 'status' else ['total', 'offset', 'nextOffset']
                      result = {k: data.get(k) for k in fields}
                      if isinstance(data.get('items'), list):
                          result['returnedItems'] = len(data['items'])
                          result['ids'] = [i.get('id', i.get('slug')) for i in data['items']]
                      print(json.dumps({'action': action, 'http': response.status, 'finalOrigin': response.url.split('/api/')[0], 'result': result}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({'action': action, 'http': error.code, 'result': 'Endpoint unavailable to an unauthenticated public client.'}))
              except Exception as error:
                  print(json.dumps({'action': action, 'errorType': type(error).__name__}))
          PY
