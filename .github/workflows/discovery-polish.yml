name: Integrate Discovery release evidence
on:
  push:
    branches: [build/discovery-v2-phase1]
    paths:
      - .github/workflows/discovery-polish.yml
      - tools/discovery-polish.mjs
permissions:
  contents: write
concurrency:
  group: discovery-v2-polish
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build/discovery-v2-phase1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply source evidence integration
        run: |
          node --check tools/discovery-polish.mjs
          node tools/discovery-polish.mjs
          rm tools/discovery-polish.mjs .github/workflows/discovery-polish.yml
          npm run format > /tmp/uixo-format.log
          git restore .github/workflows/ci.yml
      - name: Commit application changes only
        run: |
          git config user.name "UIXO Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate provenance, readiness and read-only network acceptance"
          git push origin HEAD:build/discovery-v2-phase1
