name: Temporary branch formatter

on:
  push:
    branches:
      - codex/catalogue-intelligence-facets

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'chore: apply repository formatting' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/catalogue-intelligence-facets
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "UIXO CI"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:codex/catalogue-intelligence-facets
