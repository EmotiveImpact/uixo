name: Provider review source evidence

on:
  push:
    branches: ['astra/provider-ingestion-2026-09-20']
    paths: ['.github/workflows/provider-source-evidence.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Capture only tracked source, never environment or credentials
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz --output="$PWD/evidence/source.tar.gz" HEAD
          sha256sum evidence/source.tar.gz > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: provider-source-${{ github.sha }}
          path: evidence
          retention-days: 3
