name: Format UIXO redesign

on:
  push:
    branches:
      - astra/visual-redesign-ui8-2026-09-20

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: astra/visual-redesign-ui8-2026-09-20
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format redesign files
        run: >-
          npx prettier --write
          src/components/LandingPage.tsx
          src/components/AssetPreview.tsx
          src/components/TopBar.tsx
          src/components/uixo-redesign.css
          src/main.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LandingPage.tsx src/components/AssetPreview.tsx src/components/TopBar.tsx src/components/uixo-redesign.css src/main.tsx
          git commit -m "style(ui): apply repository formatting [skip ci]"
          git push origin HEAD:astra/visual-redesign-ui8-2026-09-20
